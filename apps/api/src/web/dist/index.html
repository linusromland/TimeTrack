<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TimeTrack</title>
    <style>
      body {
        font-family: 'Inter', 'Segoe UI', sans-serif;
        background: #f1f5f9;
        display: flex;
        align-items: center;
        justify-content: center;

      }

      a { color: #0891b2; }

  <body>
    <div class="card">
      <h1>⏱ TimeTrack</h1>

      <p>API docs are available at <a href="/swagger/index.html">/swagger/index.html</a>.</p>
